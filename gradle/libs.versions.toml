[versions]
room = "2.8.5"
work-runtime = "2.12.0"
zixing-core = "3.5.4"
#noinspection AndroidGradlePluginVersion
agp = "9.4.1"
preference = "1.2.1"
material = "1.14.0"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
room3-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room3-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work-runtime" }
zixing-core = { module = "com.google.zxing:core", version.ref = "zixing-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
dotenv = { id = "co.uzzu.dotenv.gradle", version = "4.0.0" }
